spring:
  # 테스트도 본 서비스 JpaAuditingConfig 의 auditorAware 가 common 의 동명 빈을 override 해야 함
  main:
    allow-bean-definition-overriding: true

  config:
    import: ""    # Spring Cloud Config 비활성 (테스트는 외부 config 의존 없음)

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
