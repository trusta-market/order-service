spring:
  application:
    name: order-service

  profiles:
    default: local

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    config:
      label: develop
      fail-fast: false

# trusta.security.trust-gateway-headers 와 spring.main.allow-bean-definition-overriding 은
# 보안/충돌 방지를 위해 default = false 유지. local/dev 프로파일에서만 명시적으로 true 활성화.
