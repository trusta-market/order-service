spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trusta_market
    username: ${TRUSTA_DB_USERNAME}
    password: ${TRUSTA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
