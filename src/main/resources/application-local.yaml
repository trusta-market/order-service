server:
  port: 8103

spring:
  # local 한정 — common 의 auditorAware 빈을 본 서비스 JpaAuditingConfig 로 override 하려면 필요
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://localhost:5432/trusta_market
    username: ${TRUSTA_DB_USERNAME}
    password: ${TRUSTA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Liquibase가 스키마 단일 진실, JPA는 검증만
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

# Gateway 뒤에 배치된 환경에서만 X-User-* 헤더를 신뢰. local 시연 한정 활성.
trusta:
  security:
    trust-gateway-headers: true
