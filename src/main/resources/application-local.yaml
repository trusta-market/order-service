spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trusta_market
    username: ${TRUSTA_DB_USERNAME}
    password: ${TRUSTA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Liquibase가 스키마 단일 진실, JPA는 검증만
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
