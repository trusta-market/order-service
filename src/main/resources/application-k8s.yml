# K8s 환경 전용 override (SPRING_PROFILES_ACTIVE=k8s 일 때만 로드).
# config-server (Pod) 가 config-repo 의 order-service.yml 도 가져옴 — 둘이 같이 적용.

server:
  # config-server 못 닿을 때를 대비한 default. config-server 에서 가져오면 그 값 우선.
  port: 8103
  # Tomcat — 부하 테스트 결과로 default threads.max=200 이 단일 pod 의 동시 처리 한계.
  # 800 으로 증액 (stack ~800MB, memory limit 2Gi 안). accept-count 도 같이 늘려서 queue 더 받음.
  tomcat:
    threads:
      max: 800
    accept-count: 300
    max-connections: 20000

spring:
  main:
    # common 의 auditorAware 와 order 자체 JpaAuditingConfig.auditorAware 의 override 허용
    # (의도된 패턴 — order-service 의 JpaAuditingConfig 주석 참조).
    allow-bean-definition-overriding: true
  config:
    # K8s 안에선 config-server Service 로 직접 호출.
    import: "optional:configserver:http://config-server"
  cloud:
    config:
      uri: http://config-server
      label: develop
      fail-fast: false
  datasource:
    # 도메인 공유 PG (Cloud SQL 마이그레이션은 PRD §9-#10 후속).
    # username / password 는 Deployment env (Secret domain-postgres-secrets) 로 주입 — placeholder 로 받음.
    url: jdbc:postgresql://postgres:5432/trusta_market
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # HikariCP pool — default 10 이 thread 800 대비 너무 작아서 thread 가 pool 대기.
    # postgres max_connections=700 안에서 7 DB service × pool 18 × HPA max 5 = 630 (안전선).
    hikari:
      maximum-pool-size: 18
  # Kafka — GKE namespace 'kafka' 의 StatefulSet 3 broker. 새 cluster (별도 CLUSTER_ID), 토픽 초기화됨.
  kafka:
    bootstrap-servers: kafka.kafka:9092
  # 도메인별 schema 분리 — service 간 databasechangelog 충돌 + 데이터 격리.
  liquibase:
    default-schema: p_order
    liquibase-schema: p_order
  jpa:
    properties:
      hibernate:
        # JPA entity 의 @Table 에 schema 명시 없을 때 사용할 default schema.
        default_schema: p_order

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# common 의 LoginFilter 가 gateway 의 X-User-* 헤더 → SecurityContext 로 주입.
# false (default) 면 LoginFilter skip → 인증 path 401.
trusta:
  security:
    trust-gateway-headers: true
