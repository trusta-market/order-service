apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          image: asia-northeast3-docker.pkg.dev/trusta-market-id/trusta-registry-services/order-service:PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8103
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: domain-postgres-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domain-postgres-secrets
                  key: DB_PASSWORD
            # Kafka 미연결 상태에서도 startup OK (spring-kafka 는 lazy connect).
            # Kafka VM 셋업 후 ConfigMap 또는 env override.
          # request 는 실 사용량 기반 (CPU ~25m, memory ~400Mi, burst 여유 포함).
          # limit 은 thread 800 stack (~800MB) + heap (limit*25%=500MB) + 기타 = ~1.5GB 안에 맞춤.
          # request 줄임 → 노드당 pod 수 증가 → HPA scale 자리 확보 (e2-medium 4Gi 노드 기준 3 pod/노드).
          resources:
            requests:
              cpu: 100m
              memory: 800Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8103
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8103
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8103
            periodSeconds: 5
